name: Lesion identity representation projection pilot

on:
  push:
    branches:
      - research/lesion-identity-projection-pilot-20261109
    paths:
      - experiments/24_multiview_projection_pilot.py
      - .github/workflows/lesion-identity-projection-pilot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-embeddings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONHASHSEED: '20261109'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.6.1
      - name: Execute single bounded pilot on frozen embeddings
        run: |
          python experiments/24_multiview_projection_pilot.py --root . --out results/representation_projection_pilot --ranks 16 32 64 128 --bootstrap 500
      - name: Preserve independent pilot outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-embedding-projection-pilot
          path: |
            results/representation_projection_pilot/
            experiments/24_multiview_projection_pilot.py
          if-no-files-found: warn
          retention-days: 90
