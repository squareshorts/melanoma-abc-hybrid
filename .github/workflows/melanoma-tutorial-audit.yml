name: Melanoma external validation tutorial calculations

on:
  push:
    branches: [research/melanoma-tutorial-audit-20261110]
    paths:
      - tutorial/worked_example.py
      - .github/workflows/melanoma-tutorial-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tutorial:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only requirements
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 matplotlib==3.9.2 scipy==1.14.1 scikit-learn==1.6.1
      - name: Run complete score-level tutorial checks
        run: python tutorial/worked_example.py --repo . --out tutorial_results --bootstrap 250 --seed 20261110
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-audit-outputs
          path: tutorial_results/
          if-no-files-found: warn
          retention-days: 90
