name: Validate melanoma tutorial implementation

on:
  push:
    branches: [research/melanoma-tutorial-audit-20261110]
    paths:
      - tutorial/**
      - .github/workflows/melanoma-tutorial-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tutorial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONHASHSEED: '20261110'
      TUTORIAL_RESULT_DIR: 'tutorial_results'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical requirements
        run: python -m pip install -r tutorial/requirements.txt
      - name: Execute score-level tutorial
        run: python tutorial/worked_example.py --repo . --out tutorial_results --bootstrap 250 --seed 20261110
      - name: Execute six protocol and regression tests
        run: python -m unittest discover -s tutorial/tests -p 'test_worked_example.py' -v
      - name: Preserve outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesion-aware-tutorial-verified-results
          path: tutorial_results/
          retention-days: 90
          if-no-files-found: warn